spring.application.name=eventqr
spring.datasource.url=${DB_URL:jdbc:postgresql://${PGHOST:${DB_HOST:localhost}}:${PGPORT:${DB_PORT:5432}}/${PGDATABASE:${DB_NAME:eventqr}}}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false
server.port=${PORT:10000}
server.address=0.0.0.0
# Deployed behind Render's reverse proxy: let the container read X-Forwarded-For so
# getRemoteAddr() (and our rate-limiting IP) reflects the real client, not the proxy.
server.forward-headers-strategy=native
# Render's inbound proxy that forwards requests to this service has dynamic IP
# ranges (Render only publishes stable *outbound* ranges; the proxy egress CIDRs are
# not a fixed public list). Treating the proxy as trusted is required for
# X-Forwarded-For to be honored, otherwise getRemoteAddr() would report the proxy.
# TODO(production): populate internal-proxies with Render's proxy CIDR ranges before
# launch. Leave it EMPTY for now so the container trusts no upstream proxy; the
# ClientIp resolver still takes the rightmost (proxy-appended) XFF entry plus strict
# IP validation as defense in depth. Do NOT hardcode a private range that would block
# legitimate traffic behind Render's public AWS egress.
server.tomcat.remoteip.internal-proxies=${RENDER_PROXY_CIDRS:}
server.error.include-message=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
jwt.secret=${JWT_SECRET}
# TODO: JWT uses a short single-token model. Introduce a short-lived access token +
# refresh token flow (stateless refresh rotation) before the production launch.
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
app.frontend-base-url=${FRONTEND_BASE_URL:https://eventqr.app}
