spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.validation-timeout=3000
server.forward-headers-strategy=native
# Populate this with Render's inbound proxy CIDR ranges before production launch (see
# the detailed comment in application.properties). Empty for now: the container trusts
# no upstream proxy and ClientIp's rightmost-entry + validation logic owns IP safety.
server.tomcat.remoteip.internal-proxies=${RENDER_PROXY_CIDRS:}
