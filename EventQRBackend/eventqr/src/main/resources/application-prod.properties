spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.validation-timeout=3000
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
# Java 21 virtual threads: the workload is I/O-heavy (JDBC, Brevo/email gateway, QR
# image rendering). Tomcat request threads become cheap carriers instead of 200
# fixed platform threads.
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
# Left empty on purpose (Render publishes no inbound proxy ranges); see application.properties.
server.tomcat.remoteip.internal-proxies=${RENDER_PROXY_CIDRS:}
